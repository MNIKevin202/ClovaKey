[workspace]
members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Clova"]

[workspace.dependencies]
# ── Shared crypto / OTP primitives (RustCrypto, digest 0.10 generation) ──
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
data-encoding = "2"
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
# ── Storage / serialization ──
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# ── OS credential store ──
keyring = "4"
# ── QR ──
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
qrcode = { version = "0.14", default-features = false }

# ═══════════════════════════════════════════════════════════════════
# The ClovaKey desktop application (Tauri shell). All security-sensitive
# logic lives in the `clovakey-core` library crate below.
# ═══════════════════════════════════════════════════════════════════
[package]
name = "clovakey"
description = "A secure, offline-first desktop authenticator for the Clova suite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
default-run = "clovakey"

[lib]
name = "clovakey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clovakey"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clovakey-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# Enable the self-updater wiring. Off by default until an update endpoint + signing
# key are provisioned (see docs/RELEASE.md); the app is fully functional without it.
updater = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
